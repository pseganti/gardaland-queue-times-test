name: Cleanup old workflow runs

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete 50 oldest workflow runs
        uses: actions/github-script@v8
        with:
          script: |
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 2);
            const dateFilter = cutoff.toISOString().split('T')[0]; // Formato YYYY-MM-DD
            const sleep = ms => new Promise(resolve => setTimeout(resolve, ms));

            console.log(`Ricerca delle run precedenti al: ${dateFilter}`);

            // Cerca direttamente le run create prima di 7 giorni fa
            const response = await github.rest.actions.listWorkflowRunsForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              created: `<${dateFilter}`,
              status: 'completed',
              per_page: 50
            });

            const runs = response.data.workflow_runs;
            console.log(`Trovate ${runs.length} run vecchie da eliminare in questo lotto.`);

            let deleted = 0;

            for (const run of runs) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });
                console.log(`Cancellata run ${run.id} (${run.created_at})`);
                deleted++;
              } catch (err) {
                console.error(`Errore cancellazione run ${run.id}: ${err.message}`);
              }

              await sleep(400);
            }

            console.log(`Completato! Cancellate ${deleted} run vecchie.`);
