name: Halloween Facebook Post (Venerdì da Paura)

on:
  # Avvio da cron-job.org (API GitHub "workflow_dispatch"), nessun orario qui.
  # Lo script pubblica SOLO nei giorni in cui Gardaland apre la sera
  # (da opening-hours.json): negli altri giorni esce senza pubblicare.
  # Dalla scheda Actions si può avviare a mano con le opzioni di prova.
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Prova: mostra il messaggio nel log senza pubblicare'
        type: boolean
        default: false
      force:
        description: 'Pubblica anche se oggi non è una serata (solo prove)'
        type: boolean
        default: false

jobs:
  publish-halloween:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Pubblica post Venerdì da Paura
        env:
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          FORCE: ${{ inputs.force }}
        run: python .github/workflows/scripts/publish_venerdi_paura.py
