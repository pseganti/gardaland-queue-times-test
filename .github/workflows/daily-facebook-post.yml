name: Daily Facebook Post Workflow

on:
  schedule:
    # Esegue ogni mattina alle 06:00 UTC (ore 07:00 / 08:00 italiane)
    - cron: '0 6 * * *'
  # Consente l'esecuzione manuale del workflow dalla scheda Actions
  workflow_dispatch:

jobs:
  run-publisher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Esegui lo script di pubblicazione
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python .github/workflows/scripts/publish.py
