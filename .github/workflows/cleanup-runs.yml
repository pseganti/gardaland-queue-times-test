name: Cleanup old workflow runs

on:
  schedule:
    - cron: "0 0 * * *"
      timezone: "Europe/Rome"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Delete workflow runs older than 7 days
        uses: actions/github-script@v8
        with:
          script: |
            const cutoff = new Date();
            cutoff.setDate(cutoff.getDate() - 7);

            console.log(`Deleting runs older than: ${cutoff.toISOString()}`);

            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            console.log(`Found ${runs.length} workflow runs`);

            let deleted = 0;

            for (const run of runs) {
              const createdAt = new Date(run.created_at);

              if (createdAt < cutoff) {
                console.log(`Deleting run ${run.id} - ${run.name} - ${run.created_at}`);

                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });

                deleted++;
              }
            }

            console.log(`Deleted ${deleted} old workflow runs`);
