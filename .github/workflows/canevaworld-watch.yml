name: CanevaWorld Watch (eventi e promozioni)

on:
  # Avvio da cron-job.org (API GitHub "workflow_dispatch"), come gli altri workflow.
  # Si può sempre avviare anche a mano dalla scheda Actions.
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm install playwright@1.64.1

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Controlla eventi e promozioni
        env:
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        run: node .github/workflows/scripts/watch-canevaworld.mjs

      - name: Salva lo stato
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add canevaworld-watch.json || true
          git commit -m "auto: canevaworld watch [skip ci]" || exit 0
          git pull --rebase origin main
          git push
