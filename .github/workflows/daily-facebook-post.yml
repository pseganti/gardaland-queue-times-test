name: Daily Facebook Post Workflow

on:
  # Avvio ogni mattina alle 09:00 ora italiana da cron-job.org
  # (chiama l'API GitHub "workflow_dispatch"). Niente "schedule" di GitHub:
  # lavora in UTC (con l'ora legale sballa di un'ora) e parte spesso in ritardo.
  # Si può sempre avviare anche a mano dalla scheda Actions.
  workflow_dispatch:

jobs:
  run-publisher:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Esegui lo script di pubblicazione
        env:
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
        run: python .github/workflows/scripts/publish.py
