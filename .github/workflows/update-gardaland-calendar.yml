name: Update Gardaland Calendar

on:
  schedule:
    - cron: '0 2 * * *'   # Ogni notte alle 02:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install cheerio
        run: npm install cheerio

      - name: Run calendar scraper script
        run: node .github/workflows/scripts/scrape-gardaland-calendar.mjs

      - name: Commit and push if changed
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          git add gardaland-calendar-data.json

          if git diff --staged --quiet; then
            echo "ℹ️ Nessuna modifica al calendario da committare"
          else
            git commit -m "chore: aggiorna calendario affluenza Gardaland"
            git pull --rebase origin main
            git push
            echo "✅ gardaland-calendar-data.json aggiornato e pubblicato"
          fi
