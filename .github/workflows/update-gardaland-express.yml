name: Update Gardaland Express Tickets

on:
  schedule:
    - cron: '0 3 * * *' # Esegue ogni notte alle 03:00 UTC
  workflow_dispatch: # Avvio manuale da GitHub

jobs:
  scrape-express:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Express Scraper
        run: node .github/workflows/scripts/gardaland-express-scraper.mjs

      - name: Commit & Push JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add gardaland-express-export.json
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update express tickets export [skip ci]" && git push)
